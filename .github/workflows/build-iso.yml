name: Build Distro ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master, codex/coding-optimized-iso ]

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Custom Packages & Distro ISO
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          docker run --privileged --rm \
            -e HOST_UID="${HOST_UID}" \
            -e HOST_GID="${HOST_GID}" \
            -v "${PWD}:/workspace" \
            archlinux:latest bash -c "
            set -euo pipefail

            echo '==> Updating Arch repositories and installing build tools...'
            pacman -Syu --noconfirm archiso base-devel git sudo imagemagick

            echo '==> Preparing isolated ISO build workspace...'
            cp -r /workspace /tmp/iso-profile

            echo '==> Syncing standard bootloader configs (syslinux, efiboot, grub) from archiso releng...'
            cp -rn /usr/share/archiso/configs/releng/syslinux /tmp/iso-profile/
            cp -rn /usr/share/archiso/configs/releng/efiboot /tmp/iso-profile/
            cp -rn /usr/share/archiso/configs/releng/grub /tmp/iso-profile/ || true

            echo '==> Generating KryptonOS Catppuccin Mocha 4K Wallpaper...'
            mkdir -p /tmp/iso-profile/airootfs/usr/share/backgrounds/krypton
            magick -size 3840x2160 gradient:'#1e1e2e-#11111b' \
              -fill '#cba6f7' -draw 'circle 1920,1080 1920,680' \
              -blur 0x120 \
              /tmp/iso-profile/airootfs/usr/share/backgrounds/krypton/wallpaper.png

            echo '==> Populating live user home directory (/home/live) from /etc/skel...'
            mkdir -p /tmp/iso-profile/airootfs/home/live
            cp -r /tmp/iso-profile/airootfs/etc/skel/. /tmp/iso-profile/airootfs/home/live/

            echo '==> Enabling Daily-Driver systemd services (SDDM, NetworkManager, Bluetooth, Power)...'
            mkdir -p /tmp/iso-profile/airootfs/etc/systemd/system/multi-user.target.wants
            mkdir -p /tmp/iso-profile/airootfs/etc/systemd/system/graphical.target.wants
            ln -sf /usr/lib/systemd/system/sddm.service /tmp/iso-profile/airootfs/etc/systemd/system/display-manager.service
            ln -sf /usr/lib/systemd/system/NetworkManager.service /tmp/iso-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
            ln -sf /usr/lib/systemd/system/bluetooth.service /tmp/iso-profile/airootfs/etc/systemd/system/multi-user.target.wants/bluetooth.service
            ln -sf /usr/lib/systemd/system/power-profiles-daemon.service /tmp/iso-profile/airootfs/etc/systemd/system/multi-user.target.wants/power-profiles-daemon.service
            ln -sf /usr/lib/systemd/system/systemd-timesyncd.service /tmp/iso-profile/airootfs/etc/systemd/system/sysinit.target.wants/systemd-timesyncd.service || true

            echo '==> Setting up non-root build user for makepkg...'
            useradd -m -G wheel builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

            echo '==> Building Custom Packages & Distro Repo...'
            chown -R builder:builder /tmp/iso-profile

            su builder -c '
              mkdir -p /tmp/iso-profile/repo-builder/x86_64
              for pkg in /tmp/iso-profile/packages/*; do
                if [ -d \"\$pkg\" ] && [ -f \"\$pkg/PKGBUILD\" ]; then
                  echo \"Building \$pkg...\"
                  cd \"\$pkg\"
                  makepkg -d --noconfirm --nocheck
                  mv ./*.pkg.tar.zst /tmp/iso-profile/repo-builder/x86_64/ || true
                fi
              done
              cd /tmp/iso-profile/repo-builder/x86_64
              repo-add -n -R kryptonos.db.tar.zst ./*.pkg.tar.zst
            '

            echo '==> Registering local repository for ISO builder...'
            mkdir -p /var/krypton-repo/x86_64
            cp -r /tmp/iso-profile/repo-builder/x86_64/* /var/krypton-repo/x86_64/

            echo '==> Validating packages in packages.x86_64 against repos...'
            pacman --config /tmp/iso-profile/pacman.conf -Sy

            echo '==> Building Bootable ISO with mkarchiso...'
            mkdir -p /workspace/out /tmp/archiso-work
            mkarchiso -v -w /tmp/archiso-work -o /workspace/out /tmp/iso-profile

            echo '==> Restoring output ownership to runner user...'
            chown -R \${HOST_UID}:\${HOST_GID} /workspace/out
          "

      - name: Upload ISO to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptonOS-Live-ISO
          path: out/*.iso
          retention-days: 14

      - name: Create GitHub Release with Bootable ISO
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*.iso
          tag_name: ${{ github.ref_name }}
          name: "KryptonOS Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
