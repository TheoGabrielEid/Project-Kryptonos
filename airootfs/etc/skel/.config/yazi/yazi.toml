# Yazi Manager Configuration for AuraOS

[manager]
layout          = [ 1, 4, 3 ]
sort_by         = "alphabetical"
sort_sensitive  = false
sort_reverse    = false
sort_dir_first  = true
linemode        = "size"
show_hidden     = true
show_symlink    = true

[preview]
tab_size        = 2
max_width       = 1200
max_height      = 1500
cache_dir       = ""
image_filter    = "lanczos3"
image_quality   = 85
sixel_fraction  = 15

[opener]
edit = [
    { run = 'micro "$@"', block = true, desc = "micro" },
    { run = 'nvim "$@"', block = true, desc = "nvim" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open with default system handler" },
]

[open]
rules = [
    { name = "*/", use = [ "edit", "open" ] },
    { mime = "text/*", use = [ "edit", "open" ] },
    { mime = "image/*", use = [ "open" ] },
    { mime = "video/*", use = [ "open" ] },
    { mime = "application/pdf", use = [ "open" ] },
]
