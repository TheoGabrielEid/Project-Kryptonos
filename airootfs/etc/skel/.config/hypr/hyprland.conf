# ==============================================================================
# KryptonOS Hyprland Main Configuration - Developer & Coding Workflow
# ==============================================================================

# Monitor & Display Configuration (Persisted by Krypton Display Settings)
# Fallback preferred mode, overridden by ~/.config/hypr/monitors.conf
monitor = ,preferred,auto,1
source = ~/.config/hypr/monitors.conf

# Autostart essential Daemons and Services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_CSD
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_CSD
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = xdg-user-dirs-update
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout ":minimize,maximize,close"
exec-once = gsettings set org.gnome.desktop.interface gtk-decoration-layout ":minimize,maximize,close"
exec-once = waybar
exec-once = python3 /usr/local/bin/krypton-dock
exec-once = python3 /usr/local/bin/krypton-window-mode-daemon
exec-once = swaync
exec-once = /usr/local/bin/krypton-wallpaper
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/local/bin/krypton-welcome

# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11,*
env = GTK_CSD,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = BROWSER,helium-browser
env = EDITOR,nvim
env = VISUAL,code
env = GSK_RENDERER,cairo
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Cursor configuration (Critical for VMware / Virtual GPU stability)
cursor {
    no_hardware_cursors = true
    hotspot_padding = 0
    no_warps = false
    warp_on_change_workspace = false
    enable_hyprcursor = false
    inactive_timeout = 0
}

# Input device configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# Window styling & aesthetics (Catppuccin Mocha Default)
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

# Visual Decoration (Fast & Snappy for VM & Coding)
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = false
    }
}

# Active Theme Overrides (Managed by Krypton Theme Studio)
source = ~/.config/hypr/theme.conf

# KryptonOS High-FPS Buttery Smooth Animations
animations {
    enabled = true

    # Fluid Cubic Bezier Physics
    bezier = fluent_decel, 0.1, 1, 0.1, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0, 0, 1, 1

    # Window Open / Close / Move Transitions
    animation = windows, 1, 3.5, easeOutExpo, popin 85%
    animation = windowsIn, 1, 3.5, easeOutExpo, popin 85%
    animation = windowsOut, 1, 3.0, fluent_decel, popin 85%
    animation = windowsMove, 1, 3.5, easeOutExpo

    # Smooth Opacity & Border Transitions
    animation = fadeIn, 1, 3, fluent_decel
    animation = fadeOut, 1, 3, fluent_decel
    animation = fadeSwitch, 1, 3.5, fluent_decel
    animation = fadeShadow, 1, 4, fluent_decel
    animation = fadeDim, 1, 4, fluent_decel
    animation = border, 1, 4, fluent_decel
    animation = borderangle, 1, 40, linear, loop

    # Workspace Transitions (Smooth horizontal swipe & vertical minimized drawer)
    animation = workspaces, 1, 4.0, easeOutExpo, slide
    animation = specialWorkspace, 1, 3.5, easeOutExpo, slidevert
}

dwindle {
    preserve_split = true
}

# Window Management Mode (Windows Style Floating vs Hyprland Tiling)
source = ~/.config/hypr/window_mode.conf

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# Dialogs and Modal Popups that should always float
windowrule = float 1, match:title ^(Open File)$
windowrule = float 1, match:title ^(Save File)$
windowrule = float 1, match:title ^(Select a File)$
windowrule = float 1, match:title ^(File Upload)$
windowrule = float 1, match:title ^(Confirm)$
windowrule = float 1, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = float 1, match:class ^(scratchpad)$
windowrule = size 75% 65%, match:class ^(scratchpad)$
windowrule = center 1, match:class ^(scratchpad)$

# Keybindings
$mainMod = SUPER

# Applications & Developer Workflows
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, C, exec, code --no-sandbox
bind = $mainMod, N, exec, kitty --class nvim -e nvim
bind = $mainMod, G, exec, kitty --class lazygit -e lazygit
bind = $mainMod, Y, exec, kitty -e yazi
bind = $mainMod, T, exec, kitty --class btop -e btop
bind = $mainMod SHIFT, T, exec, /usr/local/bin/krypton-themes
bind = $mainMod SHIFT, P, exec, kitty --class kproj -e krypton-project
bind = $mainMod, B, exec, helium-browser
bind = $mainMod, E, exec, thunar
bind = $mainMod, SPACE, exec, rofi -show drun
bind = $mainMod, S, exec, /usr/local/bin/krypton-settings
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Scratchpad Dropdown Terminal (Quake-style quick terminal)
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = , F12, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad
workspace = special:scratchpad, on-created-empty:kitty --class scratchpad

# Window Management & Tiling Layouts
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, F, fullscreen, 0
bind = , F11, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, I, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, I, togglespecialworkspace, minimized
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, D, layoutmsg, togglesplit

# Focus navigation (Arrows + Vim HJKL)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window in layout (Shift + Arrows + Vim HJKL)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse workspace scrolling
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse drag/resize (Super + Left-Click or Alt + Left-Click drag)
bindm = $mainMod, mouse:272, movewindow
bindm = ALT, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = ALT, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim - | swappy -f -
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

# Volume and brightness keys
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioMicMute, exec, pamixer --default-source -t
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
