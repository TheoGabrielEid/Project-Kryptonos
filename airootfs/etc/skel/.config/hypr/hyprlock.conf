# ==============================================================================
# KryptonOS Lockscreen (hyprlock - Catppuccin Mocha)
# ==============================================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /usr/share/backgrounds/krypton/krypton-default.png
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 2
    blur_size = 4
    contrast = 0.8916
    brightness = 0.8172
}

image {
    monitor =
    path = /usr/share/pixmaps/kryptonos.png
    size = 96
    border_size = 2
    border_color = rgba(203, 166, 247, 0.8)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(186, 194, 222, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba(203, 166, 247, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(203, 166, 247, 0.8)
    inner_color = rgba(24, 24, 37, 0.85)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##a6adc8">Enter Password...</span></i>
    hide_input = false
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>Password Incorrect</i>
    position = 0, -100
    halign = center
    valign = center
}
