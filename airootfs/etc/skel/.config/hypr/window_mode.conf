# ==============================================================================
# KryptonOS Window Mode Configuration
# Managed dynamically by Krypton Settings -> Window Modes
# ==============================================================================

# Default Mode: Hyprland Tiling (Automatic Grid Layout)
general {
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}
