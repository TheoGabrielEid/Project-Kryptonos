# ==============================================================================
# KryptonOS Kitty Terminal - Developer Optimized Configuration
# ==============================================================================

# Font configuration (Code Ligatures + Nerd Font Icons)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# Window padding and styling
window_padding_width 10
background_opacity 0.95
confirm_os_window_close 0
enable_audio_bell no
linux_display_server auto

# Huge scrollback for compiler outputs, build logs and docker streams
scrollback_lines 25000
scrollback_pager_history_size 128

# Fast Developer Mouse Workflow
copy_on_select yes
strip_trailing_spaces smart
mouse_map right press ungrabbed paste_from_clipboard

# URL Detection and Quick Open
detect_urls yes
url_prefixes http https file ftp git
open_url_with default

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# Catppuccin Mocha Developer Theme
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #89b4fa

active_border_color     #b4befe
inactive_border_color   #45475a
bell_border_color       #f9e2af

# Tab Bar with Integrated Navigation Titlebar
tab_bar_edge top
tab_bar_style custom
tab_bar_min_tabs 1
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #181825

# 16 Terminal Colors
color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# Layouts & Window Splits
enabled_layouts splits,stack,tall,fat

# Productivity Keybindings
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map ctrl+shift+enter new_window
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

# Live Dynamic Theme
include theme.conf
