# ==============================================================================
# KryptonOS Tmux Configuration - Catppuccin Mocha & Developer Ergonomics
# ==============================================================================

# Enable full mouse support (scrolling, clicking, resizing panes)
set -g mouse on

# 24-bit TrueColor and terminal configuration
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Address vim mode switching delay (0ms escape time)
set -s escape-time 0

# Increase scrollback buffer size for big builds and logs
set -g history-limit 50000

# Increase tmux messages display duration
set -g display-time 2000

# Refresh 'status-left' and 'status-right' more often
set -g status-interval 3

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Set prefix to Ctrl-A (with Ctrl-B as secondary)
set -g prefix C-a
bind C-a send-prefix

# Intuitive pane splitting inside current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast pane resizing with Alt + hjkl
bind -n M-h resize-pane -L 3
bind -n M-l resize-pane -R 3
bind -n M-k resize-pane -U 3
bind -n M-j resize-pane -D 3

# Quick reload of tmux config
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# ==============================================================================
# Catppuccin Mocha Status Bar & Border Theme
# ==============================================================================
set -g status "on"
set -g status-position bottom
set -g status-bg "#181825"
set -g status-fg "#cdd6f4"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Status left: Session badge
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#181825,nobold] "

# Status right: Host & Clock
set -g status-right "#[fg=#89b4fa,bg=#181825] %H:%M #[fg=#11111b,bg=#a6e3a1,bold] KryptonOS "

# Window status tabs
setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W #[fg=#89b4fa,bg=#181825,nobold]"

# Mode / Selection colors
setw -g mode-style "fg=#11111b,bg=#f5e0dc"
