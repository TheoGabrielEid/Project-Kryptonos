# KryptonOS pacman.conf
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# KryptonOS Custom Repository (Our independent packages & kernel)
[kryptonos]
SigLevel = Optional TrustAll
Server = file:///var/krypton-repo/x86_64
Server = https://raw.githubusercontent.com/kryptonos/packages/main/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR gives instant binary access to prebuilt aur packages
[chaotic-aur]
SigLevel = Never
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
Server = https://geo-mirror.chaotic.cx/$repo/$arch
