# AuraOS pacman.conf
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# AuraOS Custom Repository (Our independent packages & kernel)
[auraos]
SigLevel = Optional TrustAll
Server = https://raw.githubusercontent.com/auraos/packages/main/x86_64
Server = file:///var/auraos-repo/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR gives instant binary access to chaotic-aur packages (like yay, hyprland plugins, etc.)
[chaotic-aur]
SigLevel = Never
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
Server = https://geo-mirror.chaotic.cx/$repo/$arch
